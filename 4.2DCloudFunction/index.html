<!DOCTYPE html>
<html>
<head>
    <title>Linda Remote Light Control</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 10px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }

        #status {
            margin-top: 25px;
            font-weight: bold;
            color: green;
        }

        .room {
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1> Linda Remote Light Control</h1>

    <p>Control the lights in Linda's home remotely.</p>

    <div class="room">
        <button onclick="toggleLight('living room')">
             Living Room
        </button>
    </div>

    <div class="room">
        <button onclick="toggleLight('bathroom')">
            Bathroom
        </button>
    </div>

    <div class="room">
        <button onclick="toggleLight('closet')">
             Closet
        </button>
    </div>

    <p id="status"></p>

</div>

<script>
function toggleLight(room) {
    fetch("/light", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            room: room
        })
    })
    .then(response => response.text())
    .then(data => {
        document.getElementById("status").innerText = data;
    });
}
</script>

</body>
</html>
